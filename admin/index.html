<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=2">
<title>Site Portal · Luke Watson Art &amp; Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --soft:#F4F4F2; --ink:#16150F; --ink-soft:#514E42;
    --sage:#8FB47A; --gold:#EFBB3E; --danger:#B3261E; --line:rgba(22,21,15,.16);
    --display:"Anton","Arial Narrow",sans-serif; --body:"Work Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--soft); color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:var(--display); text-transform:uppercase; letter-spacing:.01em; margin:0; line-height:1.05; font-weight:400; }
  p{ margin:0; line-height:1.55; color:var(--ink-soft); }
  button,input,textarea,select{ font:inherit; color:inherit; }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:999px; border:1px solid var(--ink); background:var(--paper); font-weight:700; font-size:.82rem; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; text-decoration:none; color:var(--ink); }
  .btn:hover{ background:var(--ink); color:var(--paper); }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ background:var(--sage); border-color:var(--sage); color:var(--ink); }
  .btn-small{ padding:7px 14px; font-size:.74rem; }
  .btn-danger{ border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn:disabled:hover{ background:var(--paper); color:var(--ink); }
  .btn-primary:disabled:hover{ background:var(--ink); color:var(--paper); }

  /* login */
  .login{ min-height:100vh; display:grid; place-items:center; padding:20px; }
  .login-card{ width:min(420px,100%); background:var(--paper); border:1px solid var(--line); border-radius:22px; padding:36px 32px; display:flex; flex-direction:column; gap:18px; }
  .login-card img{ width:min(240px,100%); height:auto; align-self:flex-start; }
  .login-card h1{ font-size:2rem; }

  /* app shell */
  .topbar{ position:sticky; top:0; z-index:10; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .topbar-in{ max-width:960px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .topbar img{ height:34px; width:auto; }
  .topbar .title{ font-family:var(--display); text-transform:uppercase; font-size:1.1rem; letter-spacing:.02em; }
  .spacer{ flex:1; }
  .tabs{ max-width:960px; margin:0 auto; padding:0 20px; display:flex; gap:6px; }
  .tab{ border:0; background:none; padding:12px 16px; font-weight:700; font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; }
  .tab[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--gold); }
  main{ max-width:960px; margin:0 auto; padding:24px 20px 190px; display:flex; flex-direction:column; gap:20px; }

  .intro{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .intro h2{ font-size:1.7rem; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:20px; }
  .art{ display:grid; grid-template-columns:150px 1fr; gap:20px; }
  @media (max-width:640px){ .art{ grid-template-columns:1fr; } }
  .thumb{ width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:12px; background:var(--soft); border:1px solid var(--line); display:block; }
  .thumb-empty{ display:grid; place-items:center; text-align:center; padding:10px; font-size:.8rem; color:var(--ink-soft); }
  .thumb-col{ display:flex; flex-direction:column; gap:10px; }
  .fields{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-content:start; }
  .fields .wide{ grid-column:1/-1; }
  @media (max-width:640px){ .fields{ grid-template-columns:1fr; } }
  label{ display:flex; flex-direction:column; gap:6px; font-size:.74rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); }
  label small{ font-weight:400; letter-spacing:0; text-transform:none; font-size:.78rem; color:var(--ink-soft); }
  input[type=text],input[type=password],input[type=url],textarea{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:.95rem; letter-spacing:0; text-transform:none; font-weight:400; color:var(--ink); }
  select[data-field=category]{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper); font-size:.95rem; letter-spacing:0; text-transform:none; font-weight:400; color:var(--ink); }
  textarea{ resize:vertical; min-height:84px; line-height:1.5; }
  .check{ flex-direction:row; align-items:center; gap:10px; text-transform:none; letter-spacing:0; font-size:.95rem; font-weight:600; color:var(--ink); }
  .check input{ width:20px; height:20px; accent-color:var(--ink); }
  .row-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .new-flag{ display:inline-block; background:var(--gold); color:var(--ink); font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:3px 10px; border-radius:999px; margin-bottom:8px; }

  .group{ display:flex; flex-direction:column; gap:14px; }
  .group h3{ font-size:1.25rem; }
  .group .fields{ grid-template-columns:1fr; }

  .photos-label{ display:block; font-size:.74rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }
  .photo-strip{ display:flex; flex-wrap:wrap; gap:10px; }
  .photo{ position:relative; width:84px; }
  .photo img{ width:84px; height:105px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; background:var(--soft); }
  .photo-remove{
    position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:50%; border:1px solid var(--danger);
    background:#fff; color:var(--danger); font-size:.8rem; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .photo-order{ display:flex; justify-content:center; gap:4px; margin-top:4px; }
  .photo-order button{ border:1px solid var(--line); background:var(--paper); border-radius:6px; font-size:.7rem; padding:2px 6px; cursor:pointer; }
  .photo-order button:disabled{ opacity:.35; cursor:not-allowed; }
  .photo-cover{ position:absolute; top:4px; left:4px; background:rgba(22,21,15,.7); color:#fff; font-size:.6rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:2px 6px; border-radius:999px; }
  .photo{ cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  .photo img{ -webkit-user-drag:none; pointer-events:none; }
  .photo.dragging{ opacity:.3; cursor:grabbing; }
  .photo.drop-target img{ outline:3px solid var(--gold); outline-offset:2px; }
  .photo.drop-target::after{ content:attr(data-drop-label); position:absolute; left:0; right:0; bottom:30px; text-align:center; font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#fff; background:var(--ink); border-radius:999px; padding:2px 0; pointer-events:none; }
  .photo-ghost{ position:fixed; z-index:50; pointer-events:none; width:84px; height:105px; object-fit:cover; border-radius:8px; border:2px solid var(--gold); box-shadow:0 10px 24px rgba(0,0,0,.28); transform:translate(-50%,-50%) rotate(-3deg); opacity:.92; }
  .photo-strip.file-over, .digital-file.file-over{ outline:2px dashed var(--gold); outline-offset:6px; border-radius:8px; }
  .digital-file{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--soft); }
  .digital-file .photos-label{ margin-bottom:6px; }
  .digital-status{ margin:6px 0 10px; font-size:.92rem; word-break:break-all; }
  .digital-status.ok{ color:#2C6B1F; }
  .digital-status.warn{ color:#7A5A00; }
  .digital-actions{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .digital-actions label.btn{ cursor:pointer; }
  .digital-hint{ font-size:.82rem; color:var(--ink-soft); }
  .progress{ position:relative; margin-top:10px; height:22px; border-radius:999px; background:#E6E4DC; overflow:hidden; }
  .progress-bar{ height:100%; width:0; background:var(--gold); transition:width .2s; }
  .progress-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; }
  body.photo-dragging, body.photo-dragging *{ cursor:grabbing !important; }
  .photo-add{
    width:84px; height:105px; border-radius:8px; border:1px dashed var(--line); background:var(--soft);
    display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:var(--ink-soft); cursor:pointer;
  }
  .photo-add:hover{ border-color:var(--ink); color:var(--ink); }

  /* save bar */
  .savebar{ position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--line); z-index:20; padding-bottom:env(safe-area-inset-bottom,0px); }
  .savebar-in{ max-width:960px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .status{ flex:1; min-width:180px; font-size:.9rem; color:var(--ink-soft); }
  .status.ok{ color:#2C6B1F; font-weight:600; }
  .status.err{ color:var(--danger); font-weight:600; }
  .notice{ width:calc(100% - 40px); max-width:920px; margin:10px auto 0; padding:10px 14px; border-radius:10px; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; font-size:.9rem; line-height:1.4; }
  .notice.warn{ background:#FFF4D6; border:1px solid #E6C25C; color:#4A3B05; }
  .notice.err{ background:#FDECEA; border:1px solid #E5A29C; color:#7A1C15; font-weight:600; }
  .notice-text{ flex:1; min-width:200px; }
  .notice .btn{ white-space:nowrap; }
  .err-text{ color:var(--danger); font-size:.9rem; font-weight:600; }
  .help{ font-size:.85rem; }
</style>
</head>
<body>

<div id="loading" class="login"><p>Loading…</p></div>

<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/images/logo-full.png" alt="Luke Watson Art & Design">
    <h1>Site Portal</h1>
    <p>Sign in to add new artwork and edit the words on your website.</p>
    <label for="pw">Password
      <input id="pw" type="password" autocomplete="current-password" required>
    </label>
    <p class="err-text" id="login-error" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit" id="login-btn">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-in">
      <img src="/images/logo-mark.png" alt="">
      <span class="title">Site Portal</span>
      <span class="spacer"></span>
      <a class="btn btn-small" href="/" target="_blank" rel="noopener">View site ↗</a>
      <button class="btn btn-small" id="logout" type="button">Sign out</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-art" aria-selected="true" data-tab="art">Artwork</button>
      <button class="tab" role="tab" id="tab-text" aria-selected="false" data-tab="text">Site text</button>
    </div>
  </header>

  <main id="main"></main>

  <div class="savebar">
    <div class="notice" id="notice" role="alert" hidden><span class="notice-text" id="notice-text"></span><span id="notice-actions"></span></div>
    <div class="savebar-in">
      <p class="status" id="status" role="status" aria-live="polite">No changes yet.</p>
      <button class="btn btn-primary" id="save" type="button" disabled>Save &amp; publish</button>
    </div>
  </div>
</div>

<script>
(function(){
  var TEXT_GROUPS = [
    { title:'Home', fields:[
      ['hero_eyebrow','Small line above the logo'],
      ['hero_lede','Intro paragraph','area'],
      ['hero_tag_1','Tag 1'],['hero_tag_2','Tag 2'],['hero_tag_3','Tag 3']
    ]},
    { title:'About', fields:[
      ['about_eyebrow','Small heading'],
      ['about_heading','Big heading'],
      ['about_p1','Paragraph 1','area'],['about_p2','Paragraph 2','area'],['about_p3','Paragraph 3','area'],
      ['about_name','Name on the card'],['about_since','Line under the name'],
      ['about_badge_1','Card list item 1'],['about_badge_2','Card list item 2'],['about_badge_3','Card list item 3']
    ]},
    { title:'Art section', fields:[
      ['art_eyebrow','Small heading'],
      ['art_heading','Big heading'],
      ['art_intro','Intro paragraph','area'],
      ['art_note','Note under the artwork','area','Leave blank to hide this note completely.']
    ]},
    { title:'Checkout', fields:[
      ['sales_tax_rate','Sales tax rate (%)','','Charged on pickup orders, Texas shipments (shipping included) and digital-only orders. Orders shipped out of state are not taxed. Example: 8.25']
    ]},
    { title:'Contact', fields:[
      ['contact_eyebrow','Small heading'],
      ['contact_heading_top','Heading (first line)'],
      ['contact_heading_script','Heading (handwritten line)'],
      ['contact_intro','Intro paragraph','area'],
      ['contact_email','Public contact email','','Shown in the website footer. Contact-form messages and order alerts are also sent here, and customers can reply to it.']
    ]},
    { title:'Links, footer & search', fields:[
      ['instagram_handle','Instagram name','','Shown on the site, e.g. @luke_rwatson'],
      ['instagram_url','Instagram link','','Must start with https://'],
      ['footer_text','Footer name (after the © year)'],
      ['site_title','Browser tab & Google title'],
      ['site_description','Google description','area']
    ]}
  ];

  var state = { content:null, sha:null, dirty:false, tab:'art' };
  var previews = {}; // uploaded path -> local blob preview URL, until publish
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };

  function show(which){
    ['loading','login','app'].forEach(function(id){ $(id).hidden = id !== which; });
  }

  function setStatus(msg, kind){
    var el = $('status');
    el.textContent = msg;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  /* ---------- notice bar: stays on screen until the problem is dealt with ---------- */
  var baseTitle = document.title;
  var notice = { kind:null };
  var lastSaveAt = 0;

  function setNotice(kind, msg, actions){
    var el = $('notice');
    notice.kind = kind || null;
    if (!kind) { el.hidden = true; return; }
    el.className = 'notice ' + kind;
    $('notice-text').textContent = msg;
    var box = $('notice-actions');
    box.innerHTML = '';
    (actions || []).forEach(function(a){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-small'; b.textContent = a.label;
      b.addEventListener('click', a.fn);
      box.appendChild(b);
    });
    el.hidden = false;
  }

  function syncDirtyUI(){
    document.title = (state.dirty ? '● ' : '') + baseTitle;
    if (state.dirty) {
      if (notice.kind !== 'err') setNotice('warn', 'You have unpublished changes. They are NOT on the website until you click Save & publish.');
    } else if (notice.kind === 'warn') {
      setNotice(null);
    }
  }

  function fail(msg, actions){
    setStatus('Not published — see the message above.', 'err');
    setNotice('err', msg, actions);
  }

  async function reloadLatest(){
    if (state.dirty && !confirm('This throws away your unpublished edits and loads the latest published version. Continue?')) return;
    setNotice(null);
    await load();
  }

  function staleNotice(){
    fail('The website was updated since you opened this page (for example a sale was recorded, or someone saved in another window). Your changes were NOT published. Copy anything you want to keep, then reload the latest version and redo your edits.',
      [{ label:'Reload latest version', fn:reloadLatest }]);
  }

  // Quietly compares our copy with the live one. Clean copy: refresh it. Edited copy: warn before saving.
  var checking = false;
  var uploading = 0;
  async function checkFresh(){
    if (checking || uploading || !state.sha || $('app').hidden || Date.now() - lastSaveAt < 15000) return;
    checking = true;
    try {
      var res = await fetch('/api/content', { credentials:'same-origin' });
      if (!res.ok) return;
      var data = await res.json();
      if (!data.sha || data.sha === state.sha) return;
      if (!state.dirty) {
        state.content = data.content; state.sha = data.sha; previews = {};
        render();
        setStatus('Refreshed — the website had newer changes.');
      } else if (notice.kind !== 'err') {
        fail('The website was updated since you opened this page (for example a sale was recorded, or someone saved in another window). Saving now would be rejected. Copy anything you want to keep, then reload the latest version.',
          [{ label:'Reload latest version', fn:reloadLatest }]);
      }
    } catch (e) {} finally { checking = false; }
  }

  function markDirty(){
    state.dirty = true;
    $('save').disabled = false;
    setStatus('You have unpublished changes.');
    syncDirtyUI();
  }

  async function api(path, method, body){
    var res = await fetch(path, {
      method: method || 'GET',
      credentials: 'same-origin',
      headers: body ? { 'Content-Type':'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    var data = await res.json().catch(function(){ return {}; });
    if (res.status === 401 && path !== '/api/login') {
      show('login');
      if (state.dirty) { var le = $('login-error'); le.textContent = 'Your session expired. Sign in again — your unpublished edits are kept.'; le.hidden = false; }
    }
    if (!res.ok) { var e = new Error(data.error || 'Something went wrong.'); e.status = res.status; throw e; }
    return data;
  }

  /* ---------- rendering ---------- */
  function render(){
    $('tab-art').setAttribute('aria-selected', state.tab === 'art');
    $('tab-text').setAttribute('aria-selected', state.tab === 'text');
    $('main').innerHTML = state.tab === 'art' ? artHtml() : textHtml();
  }

  function allCategories(){
    var seen = {}, out = [];
    state.content.artworks.forEach(function(a){
      var c = (a.category || '').trim();
      if (c && !seen[c.toLowerCase()]) { seen[c.toLowerCase()] = true; out.push(c); }
    });
    return out;
  }

  function categoryField(a){
    var hint = '<small>Shows as a filter button above the artwork on the site. “No category” keeps the piece under “All” only.</small>';
    if (a._addingCategory) {
      return '<label>Category ' + hint +
        '<input type="text" maxlength="40" data-field="category" value="' + esc(a.category) + '" placeholder="Name your new category">' +
        '<button type="button" class="btn btn-small" data-action="cancel-category" style="align-self:flex-start;margin-top:6px;">Cancel</button></label>';
    }
    var cats = allCategories();
    var cur = (a.category || '').trim();
    var opts = '<option value=""' + (cur ? '' : ' selected') + '>No category</option>' +
      cats.map(function(c){ return '<option value="' + esc(c) + '"' + (c.toLowerCase() === cur.toLowerCase() ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
      '<option value="__new__">+ Add new category…</option>';
    return '<label>Category ' + hint + '<select data-field="category">' + opts + '</select></label>';
  }

  function artHtml(){
    var list = state.content.artworks;
    var html = '<div class="intro"><div><h2>Artwork</h2><p class="help">Pieces appear on the website in this order.</p></div>' +
      '<button class="btn btn-primary" type="button" data-action="add">+ Add new piece</button></div>';
    if (!list.length) html += '<div class="card"><p>No artwork yet. Click “Add new piece” to get started.</p></div>';
    list.forEach(function(a, i){
      var cover = a.images[0];
      html += '<section class="card art" data-id="' + esc(a.id) + '">' +
        '<div class="thumb-col">' +
          (cover ? '<img class="thumb" src="' + esc(coverSrc(cover)) + '" alt="">' : '<div class="thumb thumb-empty">Add a photo</div>') +
        '</div>' +
        '<div>' +
          (a._new ? '<span class="new-flag">New</span>' : '') +
          '<div class="fields">' +
            '<label class="wide">Title<input type="text" maxlength="120" data-field="title" value="' + esc(a.title) + '"></label>' +
            '<label class="wide">Funny / short description<textarea maxlength="500" data-field="blurb">' + esc(a.blurb) + '</textarea></label>' +
            categoryField(a) +
            '<label>Size &amp; materials<input type="text" maxlength="200" data-field="meta" value="' + esc(a.meta) + '" placeholder="Original — 18&quot; x 24&quot; canvas · ink &amp; acrylic"></label>' +
            '<label>Canvas price<input type="text" maxlength="20" data-field="canvasPrice" value="' + esc(a.canvasPrice) + '" placeholder="$350"></label>' +
            '<label>Print price<input type="text" maxlength="20" data-field="printPrice" value="' + esc(a.printPrice) + '" placeholder="$35"></label>' +
            '<label>Digital Download price<input type="text" maxlength="20" data-field="digitalPrice" value="' + esc(a.digitalPrice) + '" placeholder="$15"></label>' +
            '<label class="check wide"><input type="checkbox" data-field="sold"' + (a.sold ? ' checked' : '') + '> Mark Original Canvas as Sold <small style="font-weight:400;">(prints and digital downloads stay available)</small></label>' +
            '<div class="wide">' +
              '<span class="photos-label">Photos <small style="text-transform:none;letter-spacing:0;font-weight:400;">Drag photos to reorder them — the first photo is the cover shown on the site. You can also drop new photos right onto this row.</small></span>' +
              '<div class="photo-strip">' +
                a.images.map(function(src, j){
                  return '<div class="photo" data-photo="' + j + '">' +
                    '<img src="' + esc(coverSrc(src)) + '" alt="">' +
                    (j === 0 ? '<span class="photo-cover">Cover</span>' : '') +
                    '<button type="button" class="photo-remove" data-action="remove-photo" title="Remove photo">✕</button>' +
                    '<div class="photo-order">' +
                      '<button type="button" data-action="photo-left"' + (j === 0 ? ' disabled' : '') + '>‹</button>' +
                      '<button type="button" data-action="photo-right"' + (j === a.images.length - 1 ? ' disabled' : '') + '>›</button>' +
                    '</div>' +
                  '</div>';
                }).join('') +
                '<label class="photo-add" title="Add photos">+' +
                  '<input type="file" accept="image/*" data-file multiple style="display:none">' +
                '</label>' +
              '</div>' +
            '</div>' +
            digitalBlock(a) +
          '</div>' +
          '<div class="row-actions">' +
            '<button class="btn btn-small" type="button" data-action="up"' + (i === 0 ? ' disabled' : '') + '>↑ Move up</button>' +
            '<button class="btn btn-small" type="button" data-action="down"' + (i === list.length - 1 ? ' disabled' : '') + '>↓ Move down</button>' +
            '<button class="btn btn-small btn-danger" type="button" data-action="remove">Remove piece</button>' +
          '</div>' +
          '<p class="err-text" data-err hidden></p>' +
        '</div>' +
      '</section>';
    });
    return html;
  }

  function digitalBlock(a){
    var has = !!a.digitalFile;
    var legacy = has && a.digitalFile.indexOf('blob:') !== 0;
    var name = a.digitalFileName || (has ? a.digitalFile.split('/').pop() : '');
    return '<div class="wide digital-file" data-digital>' +
      '<span class="photos-label">Digital download file <small style="text-transform:none;letter-spacing:0;font-weight:400;">Private — never shown on the website. This is the print-ready file customers receive after buying the Digital Download (JPG, PNG, TIFF, PDF or ZIP, up to 250 MB). Export it in CMYK — customers are told the file is CMYK and may look different on screen than in print.</small></span>' +
      (has
        ? '<p class="digital-status ok">✔ <strong>' + esc(name) + '</strong>' + (legacy ? ' <small>(stored with the website)</small>' : '') + '</p>'
        : '<p class="digital-status warn">⚠ No file uploaded yet. Customers who buy the download will be told Luke will email it to them.</p>') +
      '<div class="digital-actions">' +
        '<label class="btn btn-small">' + (has ? 'Replace file' : 'Upload file') +
          '<input type="file" data-digital-file accept=".jpg,.jpeg,.png,.tif,.tiff,.pdf,.zip" style="display:none"></label>' +
        (has ? '<button type="button" class="btn btn-small btn-danger" data-action="remove-digital">Remove file</button>' : '') +
        '<span class="digital-hint">or drag a file here. Goes live when you click Save &amp; publish.</span>' +
      '</div>' +
      '<div class="progress" data-progress hidden><div class="progress-bar"></div><span class="progress-text"></span></div>' +
      '<p class="err-text" data-digital-err hidden></p>' +
    '</div>';
  }

  function coverSrc(path){
    return previews[path] || '/' + path;
  }

  function textHtml(){
    var html = '<div class="intro"><div><h2>Site text</h2><p class="help">Edit the words on your website. Changes go live when you press Save &amp; publish.</p></div></div>';
    TEXT_GROUPS.forEach(function(g){
      html += '<section class="card group"><h3>' + esc(g.title) + '</h3><div class="fields">';
      g.fields.forEach(function(f){
        var key = f[0], label = f[1], kind = f[2], hint = f[3];
        var val = state.content.text[key] || '';
        html += '<label>' + esc(label) + (hint ? '<small>' + esc(hint) + '</small>' : '') +
          (kind === 'area'
            ? '<textarea data-text="' + key + '">' + esc(val) + '</textarea>'
            : '<input type="text" data-text="' + key + '" value="' + esc(val) + '">') + '</label>';
      });
      html += '</div></section>';
    });
    return html;
  }

  /* ---------- image handling ---------- */
  function compress(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(blob){
          if (!blob) { URL.revokeObjectURL(url); return reject(new Error('Could not process that image.')); }
          var r = new FileReader();
          r.onload = function(){ resolve({ data:String(r.result).split(',')[1], preview:URL.createObjectURL(blob) }); URL.revokeObjectURL(url); };
          r.readAsDataURL(blob);
        }, 'image/jpeg', 0.86);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("That photo couldn't be read. Try a JPG or PNG.")); };
      img.src = url;
    });
  }

  async function handleFiles(art, files, card){
    var err = card.querySelector('[data-err]');
    err.hidden = true;
    uploading++;
    try { await uploadAll(art, files, err); } finally { uploading--; }
  }

  var DIGITAL_MAX = 250 * 1024 * 1024;

  async function uploadDigital(art, file, card){
    var box = card.querySelector('[data-digital]');
    var err = box.querySelector('[data-digital-err]');
    var prog = box.querySelector('[data-progress]');
    var bar = prog.querySelector('.progress-bar');
    var txt = prog.querySelector('.progress-text');
    err.hidden = true;
    var ext = (file.name.match(/\.([A-Za-z0-9]+)$/) || [])[1];
    ext = ext ? ext.toLowerCase() : '';
    if (['jpg','jpeg','png','tif','tiff','pdf','zip'].indexOf(ext) === -1) { err.textContent = 'Please choose a JPG, PNG, TIFF, PDF or ZIP file.'; err.hidden = false; return; }
    if (file.size > DIGITAL_MAX) { err.textContent = 'That file is ' + Math.round(file.size / 1048576) + ' MB. The limit is 250 MB.'; err.hidden = false; return; }
    uploading++;
    try {
      var status = await api('/api/digital-upload');
      if (!status.configured) throw new Error("Private file storage isn't connected yet. Ask your web developer to add the Blob store in Vercel, then try again.");
      prog.hidden = false; bar.style.width = '0'; txt.textContent = 'Starting…';
      setStatus('Uploading ' + file.name + '…');
      var mod = await import('/admin/vendor/blob-client.js');
      var base = slug(art.title || art.id) + '-master';
      var blob = await mod.upload('digital/' + base + '.' + ext, file, {
        access: 'private',
        handleUploadUrl: '/api/digital-upload',
        multipart: file.size > 8 * 1048576,
        onUploadProgress: function(p){ bar.style.width = p.percentage + '%'; txt.textContent = 'Uploading… ' + Math.round(p.percentage) + '%'; }
      });
      art.digitalFile = 'blob:' + blob.pathname;
      art.digitalFileName = file.name.slice(0, 120);
      markDirty(); render();
      setStatus('File uploaded. Click Save & publish to make it the file customers receive.');
    } catch (e) {
      prog.hidden = true;
      err.textContent = (e && e.message) || 'The upload failed. Please try again.';
      err.hidden = false;
      setStatus('File not uploaded — see the message under the file.', 'err');
    } finally { uploading--; }
  }

  async function uploadAll(art, files, err){
    for (var i = 0; i < files.length; i++) {
      setStatus('Uploading photo' + (files.length > 1 ? ' ' + (i + 1) + ' of ' + files.length : '') + '…');
      try {
        var out = await compress(files[i]);
        var res = await api('/api/upload', 'POST', { name:files[i].name, data:out.data });
        previews[res.path] = out.preview;
        art.images.push(res.path);
        markDirty();
        render();
      } catch (e) {
        err.textContent = e.message; err.hidden = false;
        setStatus(e.message, 'err');
        return;
      }
    }
    setStatus('You have unpublished changes.');
  }

  /* ---------- events ---------- */
  function findArt(el){
    var card = el.closest('[data-id]');
    if (!card) return null;
    return { card:card, art:state.content.artworks.find(function(a){ return a.id === card.dataset.id; }) };
  }

  /* ---------- drag & drop: reorder photos (first = cover) and drop in new files ---------- */
  var drag = null;

  function dragTiles(strip){ return Array.prototype.slice.call(strip.querySelectorAll('.photo[data-photo]')); }

  function dragTarget(d, x, y){
    var tiles = dragTiles(d.strip), best = d.from, bestDist = Infinity;
    tiles.forEach(function(t, idx){
      var r = t.getBoundingClientRect();
      var dist = Math.hypot(x - (r.left + r.width / 2), (y - (r.top + r.height / 2)) * 0.6);
      if (dist < bestDist) { bestDist = dist; best = idx; }
    });
    return best;
  }

  function dragCleanup(){
    if (!drag) return;
    if (drag.ghost) drag.ghost.remove();
    drag.tile.classList.remove('dragging');
    dragTiles(drag.strip).forEach(function(t){ t.classList.remove('drop-target'); t.removeAttribute('data-drop-label'); });
    document.body.classList.remove('photo-dragging');
    try { drag.tile.releasePointerCapture(drag.id); } catch (e) {}
    drag = null;
  }

  $('main').addEventListener('pointerdown', function(e){
    var tile = e.target.closest && e.target.closest('.photo[data-photo]');
    if (!tile || e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    drag = { tile:tile, strip:tile.parentNode, from:Number(tile.dataset.photo), to:Number(tile.dataset.photo), x:e.clientX, y:e.clientY, id:e.pointerId, active:false, ghost:null };
  });

  document.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.active) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.active = true;
      try { drag.tile.setPointerCapture(drag.id); } catch (ex) {}
      var ghost = drag.tile.querySelector('img').cloneNode(false);
      ghost.className = 'photo-ghost'; ghost.removeAttribute('style');
      document.body.appendChild(ghost); drag.ghost = ghost;
      drag.tile.classList.add('dragging');
      document.body.classList.add('photo-dragging');
    }
    e.preventDefault();
    drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
    drag.to = dragTarget(drag, e.clientX, e.clientY);
    dragTiles(drag.strip).forEach(function(t, idx){
      var on = idx === drag.to && drag.to !== drag.from;
      t.classList.toggle('drop-target', on);
      if (on) t.setAttribute('data-drop-label', idx === 0 ? 'New cover' : 'Place here'); else t.removeAttribute('data-drop-label');
    });
  });

  document.addEventListener('pointerup', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag, moved = d.active && d.to !== d.from;
    var f = moved ? findArt(d.strip) : null;
    dragCleanup();
    if (moved && f) {
      f.art.images.splice(d.to, 0, f.art.images.splice(d.from, 1)[0]);
      markDirty(); render();
      setStatus(d.to === 0 ? 'New cover photo set. Click Save & publish to put it on the website.' : 'Photo moved. Click Save & publish to put the new order on the website.');
    }
  });
  document.addEventListener('pointercancel', dragCleanup);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') dragCleanup(); });

  // Dropping image files from the computer onto a piece's photo row uploads them.
  function hasFiles(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') !== -1; }
  document.addEventListener('dragover', function(e){
    if (!hasFiles(e)) return;
    e.preventDefault(); // also stops the browser from navigating away if a file misses the drop zone
    var strip = e.target.closest && e.target.closest('.photo-strip, .digital-file');
    Array.prototype.forEach.call(document.querySelectorAll('.file-over'), function(el){ if (el !== strip) el.classList.remove('file-over'); });
    if (strip) strip.classList.add('file-over');
  });
  document.addEventListener('dragleave', function(e){
    if (!e.relatedTarget) Array.prototype.forEach.call(document.querySelectorAll('.file-over'), function(el){ el.classList.remove('file-over'); });
  });
  document.addEventListener('drop', function(e){
    if (!hasFiles(e)) return;
    e.preventDefault();
    Array.prototype.forEach.call(document.querySelectorAll('.file-over'), function(el){ el.classList.remove('file-over'); });
    var zone = e.target.closest && e.target.closest('.digital-file');
    if (zone) {
      var fz = findArt(zone);
      if (fz && e.dataTransfer.files[0]) uploadDigital(fz.art, e.dataTransfer.files[0], fz.card);
      return;
    }
    var strip = e.target.closest && e.target.closest('.photo-strip');
    if (!strip) return;
    var files = Array.prototype.filter.call(e.dataTransfer.files, function(file){ return /^image\//.test(file.type); });
    var f = findArt(strip);
    if (f && files.length) handleFiles(f.art, files, f.card);
  });

  $('main').addEventListener('input', function(e){
    var t = e.target;
    if (t.dataset.text) { state.content.text[t.dataset.text] = t.value; markDirty(); return; }
    if (t.dataset.field) {
      if (t.dataset.field === 'category' && t.value === '__new__') return;
      var f = findArt(t); if (!f) return;
      f.art[t.dataset.field] = t.type === 'checkbox' ? t.checked : t.value;
      markDirty();
    }
  });

  $('main').addEventListener('change', function(e){
    if (e.target.matches('select[data-field="category"]') && e.target.value === '__new__') {
      var fc = findArt(e.target);
      if (fc) { fc.art._prevCategory = fc.art.category || ''; fc.art.category = ''; fc.art._addingCategory = true; markDirty(); render();
        var box = document.querySelector('[data-id="' + fc.art.id + '"] input[data-field="category"]'); if (box) box.focus(); }
      return;
    }
    if (e.target.matches('[data-digital-file]')) {
      var fdz = findArt(e.target), picked = e.target.files[0];
      if (fdz && picked) uploadDigital(fdz.art, picked, fdz.card);
      e.target.value = '';
      return;
    }
    if (!e.target.matches('[data-file]') || !e.target.files.length) return;
    var f = findArt(e.target);
    if (f) handleFiles(f.art, e.target.files, f.card);
  });

  $('main').addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var list = state.content.artworks, action = btn.dataset.action;
    if (action === 'add') {
      list.unshift({ id:'new-' + Math.random().toString(36).slice(2, 8), title:'', blurb:'', meta:'', canvasPrice:'', printPrice:'', digitalPrice:'', digitalFile:'', digitalFileName:'', category:'', images:[], sold:false, _new:true });
      markDirty(); render();
      var first = document.querySelector('[data-field="title"]'); if (first) first.focus();
      return;
    }

    if (action === 'remove-digital') {
      var fd = findArt(btn); if (!fd) return;
      if (!confirm('Remove the digital download file for "' + (fd.art.title || 'this piece') + '"? Customers will be told Luke will email the file until you upload a new one.')) return;
      fd.art.digitalFile = ''; fd.art.digitalFileName = '';
      markDirty(); render();
      return;
    }

    if (action === 'cancel-category') {
      var fx = findArt(btn); if (!fx) return;
      fx.art.category = fx.art._prevCategory || ''; fx.art._addingCategory = false; render();
      return;
    }

    if (action === 'remove-photo' || action === 'photo-left' || action === 'photo-right') {
      var f2 = findArt(btn); if (!f2) return;
      var photoEl = btn.closest('[data-photo]');
      var j = Number(photoEl.dataset.photo);
      if (action === 'remove-photo') { f2.art.images.splice(j, 1); }
      if (action === 'photo-left' && j > 0) { f2.art.images.splice(j - 1, 0, f2.art.images.splice(j, 1)[0]); }
      if (action === 'photo-right' && j < f2.art.images.length - 1) { f2.art.images.splice(j + 1, 0, f2.art.images.splice(j, 1)[0]); }
      markDirty(); render();
      return;
    }

    var f = findArt(btn); if (!f) return;
    var i = list.indexOf(f.art);
    if (action === 'up' && i > 0) { list.splice(i - 1, 0, list.splice(i, 1)[0]); }
    if (action === 'down' && i < list.length - 1) { list.splice(i + 1, 0, list.splice(i, 1)[0]); }
    if (action === 'remove') {
      if (!confirm('Remove "' + (f.art.title || 'this piece') + '" from the website?')) return;
      list.splice(i, 1);
    }
    markDirty(); render();
  });

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){ state.tab = t.dataset.tab; render(); });
  });

  // Reuse an existing spelling ("wildlife" -> "Wildlife"), looking only at the OTHER pieces.
  function canonCategory(art){
    var c = String(art.category || '').trim().replace(/\s+/g, ' ');
    if (!c) return '';
    var match = state.content.artworks.filter(function(o){ return o !== art && (o.category || '').trim().toLowerCase() === c.toLowerCase(); })[0];
    return match ? match.category.trim() : c;
  }

  function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'piece'; }

  $('save').addEventListener('click', async function(){
    var list = state.content.artworks;
    for (var i = 0; i < list.length; i++) {
      if (!list[i].title.trim()) { state.tab = 'art'; render(); fail('Every piece needs a title.'); return; }
      if (!list[i].images.length) { state.tab = 'art'; render(); fail('"' + list[i].title + '" needs at least one photo.'); return; }
      if (!list[i].canvasPrice.trim() || !list[i].printPrice.trim() || !list[i].digitalPrice.trim()) { state.tab = 'art'; render(); fail('"' + list[i].title + '" needs all three prices (canvas, print, digital).'); return; }
    }
    var used = {};
    var payload = {
      text: state.content.text,
      artworks: list.map(function(a){
        var id = a.id;
        if (a._new) { id = slug(a.title) + '-' + Math.random().toString(36).slice(2, 5); }
        while (used[id]) id += 'x';
        used[id] = true;
        return { id:id, title:a.title, blurb:a.blurb, meta:a.meta, canvasPrice:a.canvasPrice, printPrice:a.printPrice, digitalPrice:a.digitalPrice, digitalFile:a.digitalFile || '', digitalFileName:a.digitalFileName || '', category:canonCategory(a), images:a.images, sold:a.sold };
      })
    };
    $('save').disabled = true;
    setNotice(null);
    setStatus('Publishing…');
    try {
      var res = await api('/api/content', 'POST', { content:payload, sha:state.sha });
      state.sha = res.sha;
      state.content = res.content;
      state.dirty = false;
      lastSaveAt = Date.now();
      previews = {};
      render();
      syncDirtyUI();
      setNotice(null);
      setStatus('Published! Your changes will be live on the website in about a minute.', 'ok');
    } catch (e) {
      $('save').disabled = false;
      if (e.status === 409) staleNotice();
      else if (e.status === 401) fail('Your session expired, so nothing was published. Sign in again — your edits are kept.');
      else fail('NOT published: ' + e.message + ' Your edits are still on this page — click Save & publish to try again.');
      syncDirtyUI();
    }
  });

  $('logout').addEventListener('click', async function(){
    if (state.dirty && !confirm('You have unpublished changes that will be lost if you sign out. Sign out anyway?')) return;
    state.dirty = false;
    try { await api('/api/logout', 'POST', {}); } catch (e) {}
    location.reload();
  });

  $('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var err = $('login-error'); err.hidden = true;
    $('login-btn').disabled = true;
    try {
      await api('/api/login', 'POST', { password:$('pw').value });
      if (state.dirty && state.content) {
        $('pw').value = '';
        show('app');
        setNotice('warn', 'Signed back in. Your edits are still here — click Save & publish to publish them.');
        checkFresh();
      } else {
        await load();
      }
    } catch (ex) {
      err.textContent = ex.message; err.hidden = false;
    }
    $('login-btn').disabled = false;
  });

  window.addEventListener('beforeunload', function(e){
    if (state.dirty || uploading) { e.preventDefault(); e.returnValue = ''; }
  });

  async function load(){
    try {
      var res = await api('/api/content');
      state.content = res.content; state.sha = res.sha; state.dirty = false;
      previews = {};
      $('save').disabled = true;
      setNotice(null);
      document.title = baseTitle;
      setStatus('No changes yet.');
      render(); show('app');
    } catch (e) {
      if (e.status === 401) { show('login'); }
      else { show('login'); var err = $('login-error'); err.textContent = e.message; err.hidden = false; }
    }
  }

  window.addEventListener('focus', checkFresh);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkFresh(); });
  setInterval(function(){ if (!document.hidden) checkFresh(); }, 60000);

  (async function init(){
    try {
      var s = await api('/api/session');
      if (s.authed) { await load(); } else { show('login'); }
    } catch (e) {
      show('login');
      var err = $('login-error'); err.textContent = e.message; err.hidden = false;
    }
  })();
})();
</script>
</body>
</html>
